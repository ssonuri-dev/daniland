<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8fab">
  <title>시계 공부 · 다니랜드 🕒</title>
  <link rel="icon" href="dani.png">
  <!-- 구글 웹폰트: 제목은 Jua, 본문은 나눔고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <div class="wrap clock-page">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="뒤로">←</button>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <div class="hundred-quest">
      <div class="hundred-label" id="questLabel"></div>
      <button class="speak-btn small" id="speakBtn">🔊 다시</button>
    </div>

    <!-- 시계 크기는 js/clock.js 의 fitClock() 이 화면에 맞춰 정합니다 -->
    <div class="clock-stage" id="stage">
      <div class="clock-period" id="period" hidden></div>
      <div class="clock-face" id="face"></div>
      <div class="clock-digital" id="digital"></div>
    </div>

    <div class="cards clock-cards" id="cards"></div>

    <!-- 바늘 맞추기에서만 보입니다 -->
    <div class="clock-set-row" id="setRow">
      <button class="big-btn" id="checkBtn">다 됐어요 ✔</button>
    </div>

    <div class="tools" id="tools">
      <button class="chip" id="voiceBtn">🎤 목소리</button>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="overlay" id="startOverlay">
    <img src="dani.png" alt="다니">
    <h2 id="startTitle">🕒 시계 읽기</h2>
    <p class="hint" id="modeDesc"></p>

    <p class="hint" id="levelHint">어디까지 할까요?</p>
    <div class="level-row" id="levelRow"></div>

    <button class="big-btn" id="startBtn">시작하기 ▶</button>
    <button class="big-btn ghost" id="startHome">← 다른 놀이 고르기</button>
  </div>

  <!-- 결과 화면 -->
  <div class="overlay" id="endOverlay" hidden>
    <img src="dani.png" alt="다니">
    <h2 id="endTitle">참 잘했어요!</h2>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <button class="big-btn" id="againBtn">한 번 더 🔁</button>
    <button class="big-btn ghost" id="endModes">← 다른 놀이 고르기</button>
    <button class="big-btn ghost" id="endHome">🏠 처음으로</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/voicepicker.js"></script>
  <script src="js/clock.js"></script>
</body>
</html>
