<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8fab">
  <title>할머니 섬 여행 · 다니랜드 🏝️</title>
  <link rel="icon" href="dani.png">
  <!-- 구글 웹폰트: 제목은 Jua, 본문은 나눔고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <div class="wrap trip-page">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="뒤로">←</button>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <!-- 지금 들리는 영어 문장과 우리말 안내 -->
    <div class="trip-quest">
      <div class="trip-text">
        <div class="trip-say" id="say"></div>
        <div class="trip-hint" id="hint"></div>
      </div>
      <button class="speak-btn small" id="speakBtn" hidden>🔊 다시</button>
    </div>

    <!-- 풍경 그림. 크기는 js/trip.js 의 fitMap() 이 화면에 맞춰 정합니다.
         폰처럼 좁은 화면에서는 그림(.trip-scene)이 창(.trip-map)보다 넓어지고,
         다니를 따라 옆으로 밀려 보입니다. -->
    <div class="trip-map" id="map">
      <div class="trip-scene" id="scene">
        <div class="trip-grandma" id="grandma">👵</div>
        <div class="trip-dani" id="dani">
          <div class="trip-bubble" id="bubble" hidden></div>
          <img id="daniImg" src="dani.png" alt="다니">
          <div class="trip-ride" id="ride"></div>
        </div>
      </div>
    </div>

    <!-- 보기 카드 — 탈것 넉 장, 또는 물어볼 말·해 줄 말 석 장 -->
    <div class="cards trip-cards" id="cards"></div>

    <div class="tools">
      <button class="chip" id="voiceBtn">🎤 목소리</button>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="overlay" id="startOverlay">
    <img src="dani.png" alt="다니">
    <h2>🏝️ 할머니 섬 여행</h2>

    <p class="hint">무엇을 하고 놀까요?</p>
    <div class="mode-row" id="modeRow"></div>
    <p class="hint" id="modeDesc"></p>

    <button class="big-btn" id="startBtn">출발하기 ▶</button>
    <button class="big-btn ghost" id="startHome">← 다른 공부 고르기</button>
  </div>

  <!-- 결과 화면 -->
  <div class="overlay" id="endOverlay" hidden>
    <img src="dani.png" alt="다니">
    <h2 id="endTitle">참 잘했어요!</h2>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <button class="big-btn" id="againBtn">한 번 더 🔁</button>
    <button class="big-btn ghost" id="endModes">← 다른 놀이 고르기</button>
    <button class="big-btn ghost" id="endHome">🏠 처음으로</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/voicepicker.js"></script>
  <script src="js/trip.js"></script>
</body>
</html>
