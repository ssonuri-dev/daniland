<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#05060f">
  <title>별의 일생 · 다니랜드 ⭐</title>
  <link rel="icon" href="dani.png">
  <!-- 구글 웹폰트: 제목은 Jua, 본문은 나눔고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="space-body">
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <div class="wrap star-page">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="뒤로">←</button>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <!-- 지금 할 일 한 줄 -->
    <div class="space-quest">
      <div class="space-label" id="questLabel"></div>
      <button class="speak-btn small" id="speakBtn" hidden>🔊 다시</button>
    </div>

    <!-- 별이 자라고 부풀고 터지는 곳 — 전부 캔버스에 그립니다 (js/star.js) -->
    <div class="space-sky" id="sky">
      <canvas id="canvas"></canvas>
    </div>

    <!-- 일생의 단계 띠 — 지금 어디쯤인지 보이고, 누르면 그 단계로 되돌아갑니다 -->
    <div class="star-steps" id="steps"></div>

    <!-- 지금 단계의 사진과 이야기 -->
    <div class="star-story" id="story">
      <div class="star-photo" id="photo"></div>
      <div class="star-body">
        <div class="star-title" id="storyTitle"></div>
        <div class="star-text" id="storyText"></div>
      </div>
      <button class="star-next" id="nextBtn">다음 ▶</button>
    </div>

    <!-- 순서 맞추기 카드 · 퀴즈 보기 (그 놀이에서만 나옵니다) -->
    <div class="cards star-cards" id="cards" hidden></div>

    <div class="tools">
      <button class="chip" id="voiceBtn">🎤 목소리</button>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="overlay space-overlay" id="startOverlay">
    <img src="dani.png" alt="다니">
    <h2>⭐ 별의 일생</h2>
    <p class="hint">별도 태어나고 나이를 먹고 끝이 있어요.<br><b>별의 무게</b>가 그 별의 끝을 정해요.</p>

    <p class="hint">무엇을 하고 놀까요?</p>
    <div class="mode-row" id="modeRow"></div>
    <p class="hint" id="modeDesc"></p>

    <p class="hint" id="massHint" hidden>어떤 별을 키워 볼까요?</p>
    <div class="mode-row" id="massRow" hidden></div>

    <button class="big-btn" id="startBtn">시작하기 ▶</button>
    <button class="big-btn ghost" id="startHome">← 다른 공부 고르기</button>
    <!-- 허블·제임스웹 사진은 퍼블릭 도메인이지만 ESO·EHT 사진은 CC BY 라 출처를 밝힙니다 -->
    <p class="credit">사진: NASA · ESA · ESO · EHT · <a href="https://github.com/ssonuri-dev/daniland/blob/main/star/CREDITS.md" target="_blank" rel="noopener">출처 보기</a></p>
  </div>

  <!-- 결과 화면 -->
  <div class="overlay space-overlay" id="endOverlay" hidden>
    <img src="dani.png" alt="다니">
    <h2 id="endTitle">참 잘했어요!</h2>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <button class="big-btn" id="againBtn">한 번 더 🔁</button>
    <button class="big-btn ghost" id="endModes">← 다른 놀이 고르기</button>
    <button class="big-btn ghost" id="endHome">🏠 처음으로</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/voicepicker.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/star.js"></script>
</body>
</html>
