<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8fab">
  <title>탈것 타기 · 다니랜드 🚏</title>
  <link rel="icon" href="dani.png">
  <!-- 구글 웹폰트: 제목은 Jua, 본문은 나눔고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <div class="wrap ride-page">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="뒤로">←</button>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <!-- 지금 풀 문장(빈칸)과 우리말 안내 -->
    <div class="trip-quest">
      <div class="trip-text">
        <div class="trip-say" id="say"></div>
        <div class="trip-hint" id="hint"></div>
      </div>
      <button class="speak-btn small" id="speakBtn" hidden>🔊 다시</button>
    </div>

    <!-- 길가 풍경. 그림 파일 없이 css 로 그리고, 높이는 js/ride.js 의 fitScene() 이 화면에 맞춰 정합니다.
         탈것은 오른쪽에서 와서 다니 옆에 서고, 맞히면 다니가 타고 왼쪽으로 떠납니다. -->
    <div class="ride-scene" id="scene">
      <div class="ride-clouds">☁️<span>☁️</span><span>☁️</span></div>
      <div class="ride-trees" id="trees"></div>
      <div class="ride-road"></div>
      <div class="ride-sign">🚏</div>
      <div class="ride-car" id="car"></div>
      <img class="ride-dani" id="dani" src="dani.png" alt="다니">
    </div>

    <!-- 보기 카드 — on / in 두 장, 또는 문장 넉 장 -->
    <div class="cards ride-cards" id="cards"></div>

    <div class="tools">
      <button class="chip" id="voiceBtn">🎤 목소리</button>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="overlay" id="startOverlay">
    <img src="dani.png" alt="다니">
    <h2>🚏 탈것 타기</h2>
    <p class="hint ride-rule">
      <b>Get on</b> 은 올라타요 — bus · train · plane · ship · bike<br>
      <b>Get in</b> 은 들어가 앉아요 — car · taxi · truck
    </p>

    <p class="hint">무엇을 하고 놀까요?</p>
    <div class="mode-row" id="modeRow"></div>
    <p class="hint" id="modeDesc"></p>

    <button class="big-btn" id="startBtn">출발하기 ▶</button>
    <button class="big-btn ghost" id="startHome">← 다른 공부 고르기</button>
  </div>

  <!-- 결과 화면 -->
  <div class="overlay" id="endOverlay" hidden>
    <img src="dani.png" alt="다니">
    <h2 id="endTitle">참 잘했어요!</h2>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <button class="big-btn" id="againBtn">한 번 더 🔁</button>
    <button class="big-btn ghost" id="endModes">← 다른 놀이 고르기</button>
    <button class="big-btn ghost" id="endHome">🏠 처음으로</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/voicepicker.js"></script>
  <script src="js/ride.js"></script>
</body>
</html>
