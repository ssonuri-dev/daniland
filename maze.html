<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8fab">
  <title>미로 찾기 · 다니랜드 🧭</title>
  <link rel="icon" href="dani.png">
  <!-- 구글 웹폰트: 제목은 Jua, 본문은 나눔고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <div class="wrap maze-page">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="뒤로">←</button>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <div class="maze-quest">
      <div class="maze-label" id="questLabel"></div>
    </div>

    <!-- 미로 판. 크기는 js/maze.js 의 fitBoard() 가 화면에 맞춰 정합니다.
         벽과 길은 캔버스에 그리고, 다니만 그 위에 따로 얹습니다. -->
    <div class="maze-board" id="board">
      <canvas id="canvas"></canvas>
      <img class="maze-dani" id="dani" src="dani.png" alt="다니">
    </div>

    <div class="tools">
      <button class="chip" id="hintBtn">💡 힌트</button>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="overlay" id="startOverlay">
    <img src="dani.png" alt="다니">
    <h2>🧭 미로 찾기</h2>

    <p class="hint">손가락으로 길을 그어 간식까지 가요.<br>되돌아가지 않고 한 번에 찾으면 ⭐</p>
    <div class="level-row maze-levels" id="levelRow"></div>

    <button class="big-btn" id="startBtn">시작하기 ▶</button>
    <button class="big-btn ghost" id="startHome">← 다른 놀이 고르기</button>
  </div>

  <!-- 결과 화면 -->
  <div class="overlay" id="endOverlay" hidden>
    <img src="dani.png" alt="다니">
    <h2 id="endTitle">참 잘했어요!</h2>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <button class="big-btn" id="againBtn">한 번 더 🔁</button>
    <button class="big-btn ghost" id="endLevels">← 다른 놀이 고르기</button>
    <button class="big-btn ghost" id="endHome">🏠 처음으로</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/maze.js"></script>
</body>
</html>
