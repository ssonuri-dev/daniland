<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8fab">
  <title>코디 놀이 · 다니랜드 👗</title>
  <link rel="icon" href="dani.png">
  <!-- 구글 웹폰트: 제목은 Jua, 본문은 나눔고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <div class="wrap dress-page">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="뒤로">←</button>
      <div class="dress-title">👗 코디 놀이</div>
      <button class="icon-btn" id="shuffleBtn" title="오늘의 코디">🔀</button>
      <button class="icon-btn" id="resetBtn" title="처음으로">🔄</button>
    </div>

    <!-- 무대 — 배경 위에 옷(캐릭터)과 소품을 겹칩니다. 그림이 아직 없으면 이름이 든 빈 칸으로 보입니다. -->
    <div class="dress-stage">
      <div class="dress-scene" id="scene"></div>
    </div>

    <div class="dress-tabs" id="tabs">
      <button class="chip on" data-tab="scene">🏞️ 배경</button>
      <button class="chip" data-tab="costume">👗 옷</button>
      <button class="chip" data-tab="hair">💇 머리</button>
      <button class="chip" data-tab="accessory">✨ 소품</button>
    </div>

    <!-- 머리색 — 머리 탭에서만 보입니다. 그림 파일 없이 갈색 머리카락을 화면에서 물들입니다 (dress.js 의 tintHair) -->
    <div class="dress-colors" id="colors" hidden></div>
    <div class="dress-choices" id="choices"></div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/outfits.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/dress.js"></script>
</body>
</html>
