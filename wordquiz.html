<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8fab">
  <title>단어 퀴즈 · 다니랜드 🧠</title>
  <link rel="icon" href="dani.png">
  <!-- 구글 웹폰트: 제목은 Jua, 본문은 나눔고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/analytics.js"></script>
</head>
<body>
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <!-- 수수께끼(riddle.html)와 같은 얼개 — riddle-* 클래스를 그대로 씁니다 -->
  <div class="wrap riddle-page wq-page">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="뒤로">←</button>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <!-- 몇 번째 문제인지 한 줄 + 🔊 다시 -->
    <div class="riddle-quest">
      <div class="riddle-label" id="questLabel"></div>
      <button class="speak-btn small" id="speakBtn" hidden>🔊 다시</button>
    </div>

    <!-- 위 판: 문제, 맞히면 영어 = 우리말 (js/wordquiz.js 의 showPanel) -->
    <div class="fact-panel riddle-panel wq-panel" id="panel">
      <div class="fact-art" id="panelArt">🧠</div>
      <div class="fact-body">
        <div class="fact-title" id="panelTitle"></div>
        <div class="fact-text" id="panelText"></div>
      </div>
    </div>

    <!-- 보기 넉 장. 높이는 js/wordquiz.js 의 fitCards() 가 정합니다. -->
    <div class="cards riddle-cards wq-cards" id="cards"></div>

    <div class="tools">
      <button class="chip" id="voiceBtn">🎤 목소리</button>
    </div>
  </div>

  <!-- 시작 화면 — 놀이 고르기는 없고(네 가지 문제가 섞여 나옵니다) 소리를 켜는 첫 손가락 자리입니다 -->
  <div class="overlay" id="startOverlay">
    <img src="dani.png" alt="다니">
    <h2>🧠 단어 퀴즈</h2>
    <p class="hint">단어 공부에서 배운 낱말이 섞여 나와요.<br>한 판에 열 문제, 한 번에 맞히면 ⭐</p>
    <p class="hint riddle-count" id="countText"></p>

    <button class="big-btn" id="startBtn">시작하기 ▶</button>
    <button class="big-btn ghost" id="startHome">← 다른 놀이 고르기</button>
  </div>

  <!-- 결과 화면 -->
  <div class="overlay" id="endOverlay" hidden>
    <img src="dani.png" alt="다니">
    <h2 id="endTitle">참 잘했어요!</h2>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <button class="big-btn" id="againBtn">한 번 더 🔁</button>
    <button class="big-btn ghost" id="endHome">🏠 처음으로</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/town-places.js"></script>
  <script src="js/body-parts.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/voicepicker.js"></script>
  <script src="js/wordquiz.js"></script>
</body>
</html>
