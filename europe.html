<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8fab">
  <title>유럽 · 다니랜드 🇪🇺</title>
  <link rel="icon" href="dani.png">
  <!-- 구글 웹폰트: 제목은 Jua, 본문은 나눔고딕 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <div class="wrap europe-page">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="뒤로">←</button>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <!-- 지금 무엇을 찾아야 하는지 — 한 줄로만 나옵니다 (지도가 커야 하니까) -->
    <div class="world-quest">
      <div class="world-item" id="questItem" hidden></div>
      <div class="world-label" id="questLabel"></div>
      <button class="speak-btn small" id="speakBtn" hidden>🔊 다시</button>
    </div>

    <!-- 지도와 이야기 판. 세로 화면에서는 위아래로, 가로가 넉넉하면(.wide) 나란히 — js/europe.js 의 fitMap() 이 정합니다 -->
    <div class="eu-stage" id="stage">
      <!-- 지도 — 나라 모양은 js/europe-map.js, 국기 핀은 js/europe.js 의 COUNTRIES -->
      <div class="eu-map" id="map">
        <svg class="eu-svg" id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
        <div class="eu-pins" id="pins"></div>
        <div class="world-dani" id="dani">
          <span class="plane">✈️</span>
          <img src="dani.png" alt="다니">
        </div>
      </div>

      <!-- 이야기 판: 구경하기에서는 누른 나라의 이야기와 볼거리, 놀이에서는 문제 (js/europe.js 의 showPanel) -->
      <div class="fact-panel eu-panel" id="panel">
        <div class="fact-art" id="panelArt">🇪🇺</div>
        <div class="fact-body">
          <div class="fact-title" id="panelTitle"></div>
          <div class="fact-sv" id="panelSub" hidden></div>
          <div class="fact-text" id="panelText"></div>
          <div class="eu-chips" id="panelChips" hidden></div>
        </div>
      </div>
    </div>

    <div class="tools">
      <button class="chip" id="voiceBtn">🎤 목소리</button>
    </div>
  </div>

  <!-- 다 구경했을 때 잠깐 뜨는 안내 -->
  <div class="banner" id="banner" hidden></div>

  <!-- 시작 화면 -->
  <div class="overlay" id="startOverlay">
    <img src="dani.png" alt="다니">
    <h2>🇪🇺 유럽</h2>
    <p class="hint sweden-intro">나라 열여덟 곳을 지도에서 찾아가고, 그 나라 이야기를 들어요</p>

    <p class="hint">무엇을 하고 놀까요?</p>
    <div class="mode-row" id="modeRow"></div>
    <p class="hint" id="modeDesc"></p>

    <button class="big-btn" id="startBtn">시작하기 ▶</button>
    <button class="big-btn ghost" id="startHome">← 다른 공부 고르기</button>
    <!-- 지도 자료는 퍼블릭 도메인이라 출처를 밝힐 의무는 없지만, 어디서 왔는지는 적어 둡니다 (js/europe-map.js 머리 주석) -->
    <p class="credit">지도: Natural Earth (퍼블릭 도메인)</p>
  </div>

  <!-- 결과 화면 -->
  <div class="overlay" id="endOverlay" hidden>
    <img src="dani.png" alt="다니">
    <h2 id="endTitle">참 잘했어요!</h2>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <button class="big-btn" id="againBtn">한 번 더 🔁</button>
    <button class="big-btn ghost" id="endModes">← 다른 놀이 고르기</button>
    <button class="big-btn ghost" id="endHome">🏠 처음으로</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/voicepicker.js"></script>
  <script src="js/europe-map.js"></script>
  <script src="js/europe.js"></script>
</body>
</html>
