<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff8fab">
  <title>마을 지도 · 다니랜드 🗺️</title>
  <link rel="icon" href="dani.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 들어올 때 비밀번호 (문패입니다 — js/gate.js 주석 참고) -->
  <script src="js/gate.js"></script>

  <div class="wrap town-page">
    <div class="topbar">
      <button class="icon-btn" id="homeBtn" title="처음으로">🏠</button>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <!-- 지금 무엇을 찾아야 하는지 — 한 줄로만 나옵니다 (지도가 커야 하니까) -->
    <div class="town-quest">
      <div class="town-item" id="questItem" hidden></div>
      <div class="town-label" id="questLabel"></div>
      <button class="speak-btn small" id="speakBtn" hidden>🔊 다시</button>
    </div>

    <!-- 지도 크기는 js/town.js 가 화면에 맞춰 정합니다 -->
    <div class="town-map" id="map">
      <div class="town-spots" id="spots"></div>
      <img class="town-dani" id="dani" src="dani.png" alt="다니">
    </div>

    <div class="tools">
      <button class="chip" id="voiceBtn">🎤 목소리</button>
    </div>
  </div>

  <!-- 다 구경했을 때 잠깐 뜨는 안내 -->
  <div class="banner" id="banner" hidden></div>

  <!-- 시작 화면 -->
  <div class="overlay" id="startOverlay">
    <img src="dani.png" alt="다니">
    <h2>🗺️ 마을 지도</h2>

    <p class="hint">무엇을 하고 놀까요?</p>
    <div class="mode-row" id="modeRow"></div>
    <p class="hint" id="modeDesc"></p>

    <button class="big-btn" id="startBtn">시작하기 ▶</button>
    <button class="big-btn ghost" id="startHome">← 다른 공부 고르기</button>
  </div>

  <!-- 결과 화면 -->
  <div class="overlay" id="endOverlay" hidden>
    <img src="dani.png" alt="다니">
    <h2 id="endTitle">참 잘했어요!</h2>
    <div class="stars" id="endStars"></div>
    <p id="endText"></p>
    <button class="big-btn" id="againBtn">한 번 더 🔁</button>
    <button class="big-btn ghost" id="endModes">← 다른 놀이 고르기</button>
    <button class="big-btn ghost" id="endHome">🏠 처음으로</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/voicepicker.js"></script>
  <script src="js/town.js"></script>
</body>
</html>
